version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ma6_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432" # Chỉ cho phép localhost truỳ cập trực tiếp DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_DB}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ma6_pgdata:/var/lib/postgresql/data
    networks:
      - ma6_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: ma6_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80" # Giới hạn truy cập PgAdmin cho an toàn
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ma6_network

  backend:
    image: shiroruct/ma6-backend:latest
    build:  #xóa
      context: ./backend  #xóa
      dockerfile: Dockerfile  #xóa
    container_name: ma6_backend
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:8080
      - Cors__Origins=${CORS_ORIGINS}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${BACKEND_PORT}:8080" # Map linh hoạt OUT:IN(8080)
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_BACKEND}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ma6_network

  frontend:
    image: shiroruct/ma6-frontend:latest
    build: #xóa
      context: ./frontend  #xóa
      dockerfile: Dockerfile #xóa
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL} #xóa
    container_name: ma6-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT}:3000" # Map linh hoạt OUT:IN(3000)
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_FRONTEND}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ma6_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ma6_tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - ma6_network

volumes:
  ma6_pgdata:

networks:
  ma6_network:
    driver: bridge
