version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ma6_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ma6_pgdata:/var/lib/postgresql/data
    networks:
      - ma6_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: ma6_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - ma6_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ma6_backend
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Replace 'db' with the postgres container name within the docker network
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - ma6_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ma6_frontend
    restart: always
    args:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ma6_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ma6_tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - ma6_network

volumes:
  ma6_pgdata:

networks:
  ma6_network:
    driver: bridge
